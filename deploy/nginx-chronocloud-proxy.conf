# 老服务器（8.136.20.182，chronocloud.top）专用：只做 HTTPS 入口，
# 把接口与下载反代到新后端（60.205.142.205:8080）。
#
# 用法：
#   scp deploy/nginx-chronocloud-proxy.conf root@8.136.20.182:/etc/nginx/snippets/
#   然后在 chronocloud.top 的 server { ... } 里加一行：
#       include /etc/nginx/snippets/chronocloud-proxy.conf;
#   最后：nginx -t && nginx -s reload
#
# 注意：这些 location 必须放在 server 块内；不要放到 http 块。
# /api/v1/ai/ 必须排在 /api/ 前面（前缀更长，nginx 会优先匹配）。

location /api/v1/ai/ {
    proxy_pass http://60.205.142.205:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # 小安 SSE 不能缓冲
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /api/ {
    proxy_pass http://60.205.142.205:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /uploads/ {
    proxy_pass http://60.205.142.205:8080;
    proxy_set_header Host $host;
}

location /map/ {
    proxy_pass http://60.205.142.205:8080;
    proxy_set_header Host $host;
}

location /downloads/ {
    proxy_pass http://60.205.142.205:8080;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
}
