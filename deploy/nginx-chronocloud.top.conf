# chronocloud.top 站点配置（单机部署：nginx 直接反代到本机 18080）
#
# 部署位置：/etc/nginx/sites-available/chronocloud.top
# 启用：ln -s /etc/nginx/sites-available/chronocloud.top /etc/nginx/sites-enabled/
# 证书：certbot --nginx -d chronocloud.top -d www.chronocloud.top
#
# 历史：2026-11-26 之前这台机器只是反向代理，真正的后端在北京 60.205.142.205。
# 迁移后后端、数据库、Redis 全部在本机，**不再跨机转发**。

server {
    listen 80;
    listen [::]:80;
    server_name chronocloud.top www.chronocloud.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片上传最大 5MB（spec §5.10），留一倍余量
        client_max_body_size 32m;
        # AI 解析走同步长请求，别用默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
