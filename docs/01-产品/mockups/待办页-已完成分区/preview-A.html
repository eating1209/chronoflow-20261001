<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时纪流 · 待办页 A 方案预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 22px;
      background: #ededed;
      color: #0a0a0a;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .preview-head { width: 393px; display: flex; align-items: end; justify-content: space-between; }
    .preview-title { font-size: 18px; font-weight: 700; }
    .preview-sub { margin-top: 4px; color: #6c6c6c; font-size: 11px; }
    .preview-actions { display: flex; gap: 7px; }
    .preview-actions button {
      border: 1px solid #d4d4d4;
      border-radius: 999px;
      background: #fff;
      padding: 7px 12px;
      color: #333;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .preview-actions button:hover { background: #f5f5f5; }
    .phone {
      width: 393px;
      height: 852px;
      position: relative;
      overflow: hidden;
      border: 1px solid #dedede;
      border-radius: 34px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .16);
    }
    .status {
      height: 50px;
      padding: 15px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .status-icons { display: flex; align-items: center; gap: 8px; color: #555; font-size: 10px; }
    .battery { width: 22px; height: 11px; padding: 1px; border: 1px solid #777; border-radius: 3px; }
    .battery::after { content: ""; display: block; width: 78%; height: 100%; border-radius: 1px; background: #222; }
    .scroll {
      height: 731px;
      overflow-y: auto;
      padding: 10px 20px 88px;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }
    .eyebrow { color: #747474; font-size: 11px; }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; }
    .page-title { font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -1.3px; }
    .total { color: #777; font-size: 11px; }
    .overview {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #e7e5e0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .035);
    }
    .overview-head { display: flex; align-items: baseline; justify-content: space-between; }
    .overview-title { font-size: 15px; font-weight: 700; }
    .overview-all { color: #6f6f6f; font-size: 10.5px; }
    .urgency-bar { height: 8px; margin-top: 10px; display: flex; gap: 3px; overflow: hidden; border-radius: 99px; background: #e7e5e0; }
    .urgency-bar span { min-width: 0; height: 100%; }
    .urgency-bar .urgent { background: #b3352f; }
    .urgency-bar .soon { background: #b58500; }
    .urgency-bar .calm { background: #2e7d5b; }
    .legend { display: flex; gap: 22px; margin-top: 9px; color: #666; font-size: 10px; }
    .legend b { font-weight: 700; }
    .dot { width: 5px; height: 5px; display: inline-block; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
    .section-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
    .section-count { color: #999; font-size: 10.5px; }
    .card { overflow: hidden; border: 1px solid #e7e5e0; border-radius: 16px; background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, .035); }
    .item { position: relative; min-height: 52px; display: flex; align-items: center; padding: 0 14px; }
    .item + .item { border-top: 1px solid #efede9; }
    .item-bar { width: 4px; height: 28px; flex: 0 0 4px; margin-right: 10px; border-radius: 2px; background: #c6c6c6; }
    .item-main { min-width: 0; flex: 1; }
    .item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .item-sub { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6d6d6d; font-size: 10px; }
    .check {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      display: grid;
      place-items: center;
      margin-left: 10px;
      border: 1.2px solid #b8b8b8;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .check.done { border-color: #5e5e5e; background: #5e5e5e; }
    .done-card .item { min-height: 52px; }
    .done-card .item-title { color: #6b6b6b; text-decoration: line-through; }
    .done-card .item-sub { color: #9a9a9a; }
    .empty {
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 55px;
    }
    .empty-inner { display: flex; flex-direction: column; align-items: center; }
    .empty-note {
      position: relative;
      width: 76px;
      height: 88px;
      padding: 24px 16px;
      margin-bottom: 24px;
      border: 1px solid #e4e2dd;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .035);
    }
    .empty-line { height: 1.5px; margin-bottom: 9px; border-radius: 2px; background: #e1dfda; }
    .empty-line.short { width: 62%; }
    .empty-check { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #0a0a0a; color: #fff; font-size: 16px; }
    .empty-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
    .empty-hint { margin-top: 8px; color: #6d6d6d; font-size: 11.5px; }
    .fab {
      position: absolute;
      right: 20px;
      bottom: 88px;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #0a0a0a;
      color: #fff;
      box-shadow: 0 11px 24px rgba(0, 0, 0, .20);
      font-size: 30px;
      font-weight: 300;
    }
    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #e6e6e6;
      background: #fff;
    }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a3a3a3; font-size: 9.5px; }
    .tab.active { color: #0a0a0a; font-weight: 700; }
    .tab svg { width: 20px; height: 20px; }
    .tab.active .task-icon-bg { fill: #0a0a0a; }
    @media (max-height: 930px) {
      body { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="preview-head">
    <div>
      <div class="preview-title">待办页 · A 方案</div>
      <div class="preview-sub">点圆圈试试：任务会移到已完成，再点一次会恢复</div>
    </div>
    <div class="preview-actions">
      <button id="reset">示例数据</button>
      <button id="clear">空状态</button>
    </div>
  </div>

  <div class="phone">
    <div class="status">
      <span>11:26</span>
      <div class="status-icons"><span>▂▄▆</span><span>◔</span><span class="battery"></span><span>95</span></div>
    </div>
    <div class="scroll">
      <div class="eyebrow">周三 · 未来安排</div>
      <div class="title-row">
        <div class="page-title">11月4日</div>
        <div class="total" id="total">共 5 项</div>
      </div>
      <div id="content"></div>
    </div>
    <div class="fab">＋</div>
    <div class="tabbar">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 14h.01M12 14h.01M17 14h.01M7 18h.01M12 18h.01"/></svg>
        日历
      </div>
      <div class="tab active">
        <svg viewBox="0 0 24 24"><rect class="task-icon-bg" x="2" y="2" width="20" height="20" rx="4"/><path d="m7 12 3 3 7-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        待办
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="12" height="18" rx="1"/><rect x="16" y="8" width="6" height="13" rx="1"/><path d="M7 8h4M7 12h4M7 16h4M19 12h.01M19 16h.01"/></svg>
        组织
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.3-6.4 7.5-6.4s6.9 2.4 7.5 6.4"/></svg>
        我的
      </div>
    </div>
  </div>

  <script>
    const seed = () => [
      { id: 1, title: '联系场地', kind: 'unscheduled', done: false },
      { id: 2, title: '买演示转接头', kind: 'unscheduled', done: false },
      { id: 3, title: '提交开题报告', kind: 'urgent', due: '今天 18:00', done: false },
      { id: 4, title: '准备组会材料', kind: 'soon', due: '11月6日 20:00', done: false },
      { id: 5, title: '更新作品集', kind: 'calm', due: '11月18日', done: false },
      { id: 6, title: '确认教室借用', kind: 'completed', done: true, completedLabel: '昨天 16:20' },
      { id: 7, title: '回复导师消息', kind: 'completed', done: true, completedLabel: '11月3日 09:40' },
    ];
    let tasks = seed();
    const urgency = {
      urgent: { color: '#b3352f', label: '今天 18:00' },
      soon: { color: '#b58500', label: '11月6日 20:00' },
      calm: { color: '#2e7d5b', label: '11月18日' },
    };

    function render() {
      const open = tasks.filter(t => t.kind !== 'completed');
      const unscheduled = open.filter(t => t.kind === 'unscheduled');
      const scheduled = open.filter(t => urgency[t.kind]);
      const completed = tasks.filter(t => t.kind === 'completed');
      const groups = { urgent: [], soon: [], calm: [] };
      scheduled.forEach(t => groups[t.kind].push(t));
      document.getElementById('total').textContent = `共 ${open.length} 项`;

      if (tasks.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty"><div class="empty-inner">
            <div class="empty-note"><div class="empty-line"></div><div class="empty-line"></div><div class="empty-line short"></div><div class="empty-check">✓</div></div>
            <div class="empty-title">目前还没有待办哦</div>
            <div class="empty-hint">点右下角 ＋，记下第一件事</div>
          </div></div>`;
        return;
      }

      let html = '';
      if (scheduled.length) {
        const pct = k => groups[k].length ? `${groups[k].length}fr` : '0fr';
        html += `
          <div class="overview">
            <div class="overview-head"><div class="overview-title">任务总览</div><div class="overview-all">全部 ${scheduled.length} 项</div></div>
            <div class="urgency-bar"><span class="urgent" style="flex:${pct('urgent')}"></span><span class="soon" style="flex:${pct('soon')}"></span><span class="calm" style="flex:${pct('calm')}"></span></div>
            <div class="legend"><span><i class="dot" style="background:#b3352f"></i>紧急 <b>${groups.urgent.length}</b></span><span><i class="dot" style="background:#b58500"></i>临近 <b>${groups.soon.length}</b></span><span><i class="dot" style="background:#2e7d5b"></i>从容 <b>${groups.calm.length}</b></span></div>
          </div>`;
      }
      if (unscheduled.length) {
        html += section('待安排', unscheduled, 'unscheduled');
      }
      if (scheduled.length) {
        html += `
          <div class="section">
            <div class="section-head"><div class="section-title">任务</div><div class="section-count">${scheduled.length} 项</div></div>
            <div class="card">${scheduled.map(itemHtml).join('')}</div>
          </div>`;
      }
      if (completed.length) {
        html += `
          <div class="section">
            <div class="section-head"><div class="section-title">已完成</div><div class="section-count">${completed.length} 项</div></div>
            <div class="card done-card">${completed.map(itemHtml).join('')}</div>
          </div>`;
      }
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => toggle(Number(btn.dataset.toggle)));
      });
    }

    function section(title, items, kind) {
      return `<div class="section"><div class="section-head"><div class="section-title">${title}</div><div class="section-count">${items.length} 项</div></div><div class="card">${items.map(itemHtml).join('')}</div></div>`;
    }

    function itemHtml(task) {
      const done = task.kind === 'completed';
      const color = done ? '#b9b9b9' : task.kind === 'unscheduled' ? '#c6c6c6' : urgency[task.kind].color;
      const sub = done ? task.completedLabel : task.kind === 'unscheduled' ? '待办 · 未设置截止时间' : `待办 · ${task.due}`;
      return `<div class="item"><span class="item-bar" style="background:${color}"></span><div class="item-main"><div class="item-title">${task.title}</div><div class="item-sub">${sub}</div></div><button class="check ${done ? 'done' : ''}" data-toggle="${task.id}" aria-label="${done ? '恢复' : '完成'} ${task.title}">${done ? '✓' : ''}</button></div>`;
    }

    function toggle(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (task.kind === 'completed') {
        task.kind = task.restoreKind || 'unscheduled';
        task.due = task.restoreDue;
        return render();
      }
      task.restoreKind = task.kind;
      task.restoreDue = task.due;
      task.kind = 'completed';
      task.completedLabel = '刚刚';
      render();
    }

    document.getElementById('reset').addEventListener('click', () => { tasks = seed(); render(); });
    document.getElementById('clear').addEventListener('click', () => { tasks = []; render(); });
    render();
  </script>
</body>
</html>
