  <circle cx="472" cy="1151" r="6" fill="none" stroke="#a6a095" stroke-width="1.4"/>
  <path d="M462 1167c1.6-6 5.1-9 10-9s8.4 3 10 9" fill="none" stroke="#a6a095" stroke-width="1.4" stroke-linecap="round"/>
  <text x="472" y="1182" font-size="10" class="secondary" text-anchor="middle">我的</text>
