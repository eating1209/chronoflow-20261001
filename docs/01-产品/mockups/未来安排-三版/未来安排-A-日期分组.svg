    </filter>
    <clipPath id="barClip">
      <rect x="44" y="192" width="452" height="12" rx="6"/>
    </clipPath>
  </defs>

  <rect width="540" height="1200" fill="#f6f1e7"/>

  <!-- 状态栏 -->
  <text x="24" y="29" font-size="12" font-weight="700" class="primary">9:41</text>
  <g fill="#1f1f1b">
    <rect x="454" y="23" width="3" height="7" rx="1"/>
    <rect x="460" y="20" width="3" height="10" rx="1"/>
    <rect x="466" y="17" width="3" height="13" rx="1"/>
    <rect x="474" y="18" width="20" height="11" rx="3"/>
    <rect x="496" y="21" width="2" height="5" rx="1"/>
  </g>

  <!-- 页头 -->
