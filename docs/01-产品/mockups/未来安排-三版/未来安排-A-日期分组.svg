      .secondary { fill: #6f695e; }
      .tertiary { fill: #9a9285; }
      .red { fill: #c3483d; }
      .gold { fill: #d8a229; }
      .green { fill: #3f946d; }
    </style>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
